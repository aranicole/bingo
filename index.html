<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6347f">
<title>Bingo Caller</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#e83e8c; --felt-2:#6b0f45; --ivory:#fff6fa; --ink:#3a1028; --muted:#ffd3e8;
  --B:#2f6fd6; --I:#d8392f; --N:#8a8f98; --G:#2e9e55; --O:#f0a319;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:linear-gradient(160deg,#ff9ccf 0%,#e83e8c 42%,#6b0f45 100%) fixed;
  color:var(--ivory);font-family:var(--body);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.app{max-width:1180px;margin:0 auto;padding:14px;display:grid;gap:16px;
  grid-template-columns:minmax(300px,420px) 1fr;align-items:start}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font:400 1.7rem/1 var(--display);margin:0;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
h1 img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.count{color:var(--muted);font-weight:600}
.panel{background:rgba(90,0,50,.28);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(4px);border-radius:18px;padding:16px}

/* machine */
.stage{position:relative;width:min(100%,330px);aspect-ratio:1;margin:4px auto 14px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.28),rgba(255,255,255,.05) 45%,rgba(0,0,0,.25) 100%);
  border:6px solid rgba(255,255,255,.35);box-shadow:inset 0 0 40px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35);
  display:grid;place-items:center;overflow:hidden}
.stage::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 30% 18%,rgba(255,255,255,.45),transparent 40%)}
.ball{width:72%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 0%);
  background:var(--c);box-shadow:inset -10px -14px 24px rgba(0,0,0,.35),inset 8px 10px 18px rgba(255,255,255,.35),0 10px 22px rgba(0,0,0,.4);
  transition:transform .35s cubic-bezier(.2,1.5,.4,1),opacity .2s}
.ball .inner{width:68%;aspect-ratio:1;border-radius:50%;background:var(--ivory);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9;box-shadow:inset 0 -4px 8px rgba(0,0,0,.18)}
.ball .l{font:400 clamp(1.4rem,6vw,2rem) var(--display);color:var(--c)}
.ball .n{font:400 clamp(3.2rem,16vw,5.2rem) var(--display)}
.ball.empty{--c:#b5527f}.ball.empty .n{font-size:clamp(2.4rem,10vw,3.6rem);color:#b5527f}
.stage.shaking .ball{transform:scale(0);opacity:0}
.swarm{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .15s}
.stage.shaking .swarm{opacity:1}
.stage.shaking{animation:shake .16s infinite}
.mini{position:absolute;width:17%;aspect-ratio:1;border-radius:50%;background:var(--c);left:41%;top:41%;
  box-shadow:inset -4px -5px 8px rgba(0,0,0,.35),inset 3px 3px 6px rgba(255,255,255,.4);
  animation:tumble var(--t) ease-in-out infinite alternate}
.mini::after{content:"";position:absolute;inset:28%;border-radius:50%;background:var(--ivory);opacity:.9}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-5px,3px) rotate(-1.5deg)}
  50%{transform:translate(4px,-4px) rotate(1.2deg)}75%{transform:translate(-3px,-2px) rotate(-1deg)}100%{transform:translate(5px,4px) rotate(1.5deg)}}
@keyframes tumble{0%{transform:translate(var(--x1),var(--y1))}50%{transform:translate(var(--x2),var(--y2))}100%{transform:translate(var(--x3),var(--y3))}}
.stage.pop .ball{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}

.drawbtn{width:100%;padding:16px;border:0;border-radius:14px;font:400 1.5rem var(--display);letter-spacing:.5px;
  background:linear-gradient(180deg,#fff6fa,#ffc0dc);color:#7a0f45;cursor:pointer;box-shadow:0 5px 0 #b0306f;transition:transform .08s,box-shadow .08s}
.drawbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #b0306f}
.drawbtn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.field{flex:1 1 140px;display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
select,button.sec{font:600 1rem var(--body);padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);color:var(--ivory);min-height:44px}
select option{color:#111}select{max-width:100%}
button.sec{cursor:pointer}
button.sec:hover{background:rgba(255,255,255,.16)}
button.sec[aria-pressed=true]{background:#fff6fa;border-color:#fff6fa;color:#7a0f45}
.switches{display:flex;gap:10px;flex-wrap:wrap}
.switches button{flex:1 1 120px}
.recent{display:flex;gap:8px;align-items:center;margin-top:14px;min-height:46px;flex-wrap:wrap}
.recent b{color:var(--muted);font-size:.85rem;margin-right:4px}
.chip{display:inline-grid;place-items:center;min-width:46px;padding:7px 8px;border-radius:999px;background:var(--c);
  font:400 .95rem var(--display);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}

/* board */
.board{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:34px repeat(15,1fr);gap:4px;align-items:stretch}
.hd{display:grid;place-items:center;border-radius:8px;background:var(--c);color:#fff;font:400 1.1rem var(--display);aspect-ratio:auto;min-height:30px}
.cell{display:grid;place-items:center;border-radius:6px;background:rgba(255,255,255,.14);color:rgba(255,246,250,.6);
  font-weight:700;font-size:.82rem;min-height:34px}
.cell.on{background:var(--c);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.cell.latest{outline:3px solid var(--ivory);outline-offset:1px;animation:blink 1s ease-in-out infinite alternate}
@keyframes blink{to{outline-color:transparent}}
.B{--c:var(--B)}.I{--c:var(--I)}.N{--c:var(--N)}.G{--c:var(--G)}.O{--c:var(--O)}
.O.cell.on{color:#2b1a00}.O.chip{color:#2b1a00;text-shadow:none}
.ball.O .l{color:#c98300}
h2{font:400 1.1rem var(--display);margin:0 0 12px}
.hint{color:var(--muted);font-size:.85rem;margin:12px 0 0}

@media (max-width:820px){
  .app{grid-template-columns:1fr;padding:10px}
  h1{font-size:1.4rem}
  .brow{grid-template-columns:24px repeat(15,1fr);gap:2px}
  .cell{font-size:.62rem;min-height:26px;border-radius:4px}
  .hd{font-size:.85rem;min-height:26px;border-radius:5px}
  .panel{padding:12px}
}
@media (prefers-reduced-motion:reduce){
  .stage.shaking{animation:none}.mini{animation-duration:1.2s!important}.cell.latest{animation:none}.stage.pop .ball{animation:none}
}
:focus-visible{outline:3px solid var(--ivory);outline-offset:2px}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1><img src="icon.png" alt="" onerror="this.remove()">Bingo Caller</h1>
    <span class="count" id="count" aria-live="polite">0 of 75 called</span>
  </header>

  <section class="panel" aria-label="Ball machine">
    <div class="stage" id="stage">
      <div class="swarm" id="swarm" aria-hidden="true"></div>
      <div class="ball empty" id="ball" role="img" aria-live="assertive" aria-label="No number drawn yet">
        <div class="inner"><span class="l" id="bl"></span><span class="n" id="bn">Ready</span></div>
      </div>
    </div>

    <button class="drawbtn" id="draw">Draw number</button>

    <div class="row">
      <label class="field">Shake sound
        <select id="sound">
          <option value="maracas">Maracas rattle</option>
          <option value="cage">Bingo cage rumble</option>
          <option value="marbles">Marbles clatter</option>
          <option value="off">Off</option>
        </select>
      </label>
      <label class="field">Auto-draw every
        <select id="interval">
          <option value="5">5 seconds</option>
          <option value="8" selected>8 seconds</option>
          <option value="12">12 seconds</option>
          <option value="20">20 seconds</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label class="field">Voice
        <select id="voiceSel"><option value="">Default voice</option></select>
      </label>
      <label class="field">Speaking speed
        <select id="rate">
          <option value="0.7">Slow</option>
          <option value="0.85" selected>Normal</option>
          <option value="1">Fast</option>
        </select>
      </label>
    </div>
    <div class="row switches">
      <button class="sec" id="voice" aria-pressed="true">Voice: on</button>
      <button class="sec" id="auto" aria-pressed="false">Auto-draw: off</button>
      <button class="sec" id="repeat">Repeat call</button>
      <button class="sec" id="testv">Test voice</button>
    </div>

    <p class="hint" id="vstatus" aria-live="polite"></p>

    <div class="recent" id="recent"><b>Last calls</b></div>
    <div class="row"><button class="sec" id="reset" style="flex:1">New game</button></div>
    <p class="hint">Tip: press Space to draw. Turn up your volume so everyone can hear.</p>
  </section>

  <section class="panel" aria-label="Draw history">
    <h2>Draw history</h2>
    <div class="board" id="board"></div>
  </section>
</main>

<script>
(function(){
  const LET = ["B","I","N","G","O"];
  const $ = id => document.getElementById(id);
  const stage=$("stage"), ball=$("ball"), drawBtn=$("draw");
  const SHAKE_MS = matchMedia("(prefers-reduced-motion: reduce)").matches ? 700 : 1800;

  let state = { drawn: [], sound:"maracas", voice:true, interval:"8", voiceName:"", rate:"0.85" };
  try { const s = JSON.parse(localStorage.getItem("bingo-state")||"null"); if (s && Array.isArray(s.drawn)) state = Object.assign(state,s); } catch(e){}
  const save = () => { try { localStorage.setItem("bingo-state", JSON.stringify(state)); } catch(e){} };

  let busy=false, autoOn=false, autoTimer=null;
  const letterOf = n => LET[Math.floor((n-1)/15)];

  /* ---------- board ---------- */
  const board=$("board"), cells={};
  LET.forEach((L,r)=>{
    const row=document.createElement("div"); row.className="brow";
    const h=document.createElement("div"); h.className="hd "+L; h.textContent=L; row.appendChild(h);
    for(let i=1;i<=15;i++){
      const n=r*15+i, c=document.createElement("div");
      c.className="cell "+L; c.textContent=n; cells[n]=c; row.appendChild(c);
    }
    board.appendChild(row);
  });

  /* ---------- machine swarm ---------- */
  const swarm=$("swarm"), pal=["--B","--I","--G","--O","--N"];
  const rnd=(a,b)=>Math.random()*(b-a)+a;
  for(let i=0;i<14;i++){
    const m=document.createElement("div"); m.className="mini";
    m.style.setProperty("--c",`var(${pal[i%5]})`);
    for(let k=1;k<=3;k++){ m.style.setProperty("--x"+k,rnd(-150,150)+"%"); m.style.setProperty("--y"+k,rnd(-150,150)+"%"); }
    m.style.setProperty("--t",rnd(.16,.3)+"s");
    swarm.appendChild(m);
  }

  /* ---------- render ---------- */
  function showBall(n){
    ball.className = "ball " + (n?letterOf(n):"empty");
    $("bl").textContent = n?letterOf(n):"";
    $("bn").textContent = n?n:"Ready";
    ball.setAttribute("aria-label", n?`${letterOf(n)} ${n}`:"No number drawn yet");
  }
  function render(){
    const last = state.drawn[state.drawn.length-1];
    for(let n=1;n<=75;n++){ cells[n].classList.toggle("on", state.drawn.includes(n)); cells[n].classList.toggle("latest", n===last); }
    showBall(last||0);
    $("count").textContent = `${state.drawn.length} of 75 called`;
    const rec=$("recent"); rec.innerHTML="<b>Last calls</b>";
    state.drawn.slice(-6,-1).reverse().forEach(n=>{
      const c=document.createElement("span"); c.className="chip "+letterOf(n); c.textContent=letterOf(n)+n; rec.appendChild(c);
    });
    drawBtn.disabled = busy || state.drawn.length>=75;
    drawBtn.textContent = state.drawn.length>=75 ? "All 75 called" : (busy ? "Shaking…" : "Draw number");
  }

  /* ---------- sound (synthesised, no files needed) ---------- */
  let ac=null, noiseBuf=null;
  function ctx(){
    if(!ac){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; ac=new A();
      noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    if(ac.state==="suspended") ac.resume();
    return ac;
  }
  function noise(t,dur,type,freq,gain,q){
    const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q;
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t+dur+0.02);
  }
  function tone(t,freq,dur,gain,type){
    const o=ac.createOscillator(); o.type=type||"sine"; o.frequency.value=freq;
    const g=ac.createGain(); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function playShake(kind,ms){
    if(kind==="off"||!ctx()) return;
    const t0=ac.currentTime, end=ms/1000;
    if(kind==="maracas"){
      for(let t=0;t<end;t+=0.07) noise(t0+t+rnd(0,.02),.05,"highpass",5500,rnd(.12,.35));
    } else if(kind==="cage"){
      noise(t0,end,"lowpass",260,.5,1);
      for(let t=0;t<end;t+=0.11) tone(t0+t+rnd(0,.05),rnd(150,320),.07,rnd(.15,.3),"triangle");
      for(let t=0;t<end;t+=0.13) noise(t0+t+rnd(0,.05),.03,"bandpass",1800,rnd(.15,.3),2);
    } else if(kind==="marbles"){
      for(let t=0;t<end;t+=0.045) tone(t0+t+rnd(0,.03),rnd(1800,4200),.06,rnd(.05,.16),"sine");
    }
    // closing "pop" as the ball drops out
    tone(t0+end,520,.12,.18,"sine");
  }

  /* ---------- voice ---------- */
  let keep=null, primed=false;
  const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
  // Android/iOS only allow speech after a tap: "prime" it inside the tap handler
  function primeSpeech(){
    // iOS 16.4+: play through the speaker even when the silent switch is on
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
    if(!synth) return;
    // re-prime on every tap: iOS home-screen apps lose speech permission easily
    try{ const u=new SpeechSynthesisUtterance("a"); u.volume=0; synth.speak(u); }catch(e){}
  }
  function speak(n){
    if(!state.voice||!synth) return;
    if(synth.speaking||synth.pending) synth.cancel();
    setTimeout(()=>{
      const L=letterOf(n);
      const u=new SpeechSynthesisUtterance(`${L}, ${n}. ${L}, ${n}.`);
      const v=synth.getVoices().find(x=>x.name===state.voiceName);
      if(v){ u.voice=v; u.lang=v.lang; } else { u.lang="en-US"; }
      u.rate=Number(state.rate)||.85; u.pitch=1; u.volume=1;
      let started=false; u.onstart=()=>{ started=true; $("vstatus").textContent=""; };
      setTimeout(()=>{ if(!started&&state.voice) $("vstatus").textContent="The voice didn't start. Tap Test voice once, check the volume and the silent switch, or open the link in Safari instead of the home-screen icon."; },2500);
      keep=u;               // keep a reference so Android doesn't garbage-collect it mid-speech
      try{ synth.resume(); }catch(e){}
      synth.speak(u);
    },100);
  }
  function loadVoices(){
    if(!synth) { $("vstatus").textContent="This browser can't speak numbers aloud. Try Chrome, Edge or Safari."; return true; }
    const sel=$("voiceSel"), vs=synth.getVoices().filter(v=>/^en/i.test((v.lang||"").replace("_","-")));
    if(!vs.length){
      $("vstatus").textContent="No selectable English voices found, so your phone's default voice is used. No sound? Raise media volume and check Settings > System > Languages > Text-to-speech output.";
      return false;
    }
    sel.innerHTML='<option value="">Default voice</option>';
    vs.slice().sort((a,b)=>(a.lang+a.name).localeCompare(b.lang+b.name)).forEach(v=>{
      const o=document.createElement("option"); o.value=v.name; o.textContent=`${v.name} (${v.lang})`; sel.appendChild(o);
    });
    sel.value=state.voiceName;
    if(sel.value!==state.voiceName) sel.value="";
    $("vstatus").textContent="";
    return true;
  }
  if(synth){
    loadVoices(); synth.onvoiceschanged=loadVoices;
    let tries=0; const poll=setInterval(()=>{ if(loadVoices()||++tries>8) clearInterval(poll); },500);
  } else loadVoices();

  /* ---------- draw ---------- */
  function draw(){
    if(busy||state.drawn.length>=75) return;
    clearTimeout(autoTimer);
    busy=true; render();
    if(synth) synth.cancel();
    primeSpeech();
    const pool=[]; for(let n=1;n<=75;n++) if(!state.drawn.includes(n)) pool.push(n);
    const n=pool[Math.floor(Math.random()*pool.length)];
    stage.classList.remove("pop"); stage.classList.add("shaking");
    playShake(state.sound,SHAKE_MS);
    setTimeout(()=>{
      stage.classList.remove("shaking");
      state.drawn.push(n); save();
      busy=false; render();
      stage.classList.add("pop");
      speak(n);
      if(autoOn && state.drawn.length<75) autoTimer=setTimeout(draw,Number(state.interval)*1000);
      else if(state.drawn.length>=75) setAuto(false);
    },SHAKE_MS);
  }

  function setAuto(on){
    autoOn=on; clearTimeout(autoTimer);
    const b=$("auto"); b.setAttribute("aria-pressed",on); b.textContent="Auto-draw: "+(on?"on":"off");
    if(on && !busy) draw();
  }

  /* ---------- controls ---------- */
  drawBtn.onclick=draw;
  $("auto").onclick=()=>{ primeSpeech(); setAuto(!autoOn); };
  $("repeat").onclick=()=>{ primeSpeech(); const l=state.drawn[state.drawn.length-1]; if(l){ const v=state.voice; state.voice=true; speak(l); state.voice=v; } };
  $("voice").onclick=()=>{ state.voice=!state.voice; syncUI(); save(); if(!state.voice&&"speechSynthesis" in window) speechSynthesis.cancel(); };
  $("sound").onchange=e=>{ state.sound=e.target.value; save(); if(state.sound!=="off") playShake(state.sound,700); };
  const preview=()=>{ const l=state.drawn[state.drawn.length-1]||Math.ceil(Math.random()*75); const v=state.voice; state.voice=true; speak(l); state.voice=v; };
  $("testv").onclick=()=>{ primeSpeech(); preview(); };
  $("voiceSel").onchange=e=>{ state.voiceName=e.target.value; save(); preview(); };
  $("rate").onchange=e=>{ state.rate=e.target.value; save(); preview(); };
  $("interval").onchange=e=>{ state.interval=e.target.value; save(); };
  $("reset").onclick=()=>{
    if(state.drawn.length && !confirm("Start a new game? All called numbers will be cleared.")) return;
    setAuto(false); if("speechSynthesis" in window) speechSynthesis.cancel();
    state.drawn=[]; busy=false; save(); stage.classList.remove("shaking","pop"); render();
  };
  document.addEventListener("keydown",e=>{
    if(e.code==="Space" && !/SELECT|BUTTON|INPUT/.test(document.activeElement.tagName)){ e.preventDefault(); draw(); }
  });
  function syncUI(){
    $("voice").setAttribute("aria-pressed",state.voice); $("voice").textContent="Voice: "+(state.voice?"on":"off");
    $("sound").value=state.sound; $("interval").value=state.interval; $("rate").value=state.rate;
  }
  syncUI(); render();
})();
</script>
</body>
</html>
